    <script>
      // Private order capabilities stay out of referrers and analytics URLs.
      (() => {
        const order = new URLSearchParams(location.search).get('order');
        const access = new URLSearchParams(location.hash.slice(1)).get('access');
        if (order && /^[a-f0-9-]{36}$/i.test(order) && access && /^[a-f0-9]{64}$/.test(access)) {
          try { sessionStorage.setItem('book-order:' + order, access); } catch {}
          history.replaceState(null, '', location.pathname + location.search);
        }
      })();
    </script>
